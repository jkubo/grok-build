name: sync-upstream

# Schedule only runs from the default branch (jkubo). Does not PR at xai-org.
on:
  schedule:
    - cron: "17 17 * * *" # 02:17 JST
  workflow_dispatch:
  push:
    branches: [jkubo]

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: jkubo

      - name: Fetch remotes
        run: |
          git remote add upstream https://github.com/xai-org/grok-build.git 2>/dev/null \
            || git remote set-url upstream https://github.com/xai-org/grok-build.git
          git config user.name "Jay Kubo"
          git config user.email "6161465+jkubo@users.noreply.github.com"

      - name: Rebase onto upstream
        id: sync
        run: |
          set -o pipefail
          ./scripts/sync-upstream.sh --push --no-pull-origin 2>&1 | tee "${RUNNER_TEMP:-/tmp}/sync-upstream.log"

      - name: Record the open fork-sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          title="fork sync failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          log_file="${RUNNER_TEMP:-/tmp}/sync-upstream.log"
          body_file="${RUNNER_TEMP:-/tmp}/fork-sync-issue.md"
          {
            echo 'scripts/sync-upstream.sh --push failed.'
            echo
            echo "- Run: ${run_url}"
            echo "- Workflow SHA: \`${GITHUB_SHA}\`"
            echo "- Fork branch after the attempt: \`${{ steps.sync.outputs.sha }}\`"
            echo "- Upstream: \`${{ steps.sync.outputs.upstream }}\`"
            echo "- Runbook: FORK.md"
            echo
            echo 'Log tail:'
            echo
            echo '```'
            if [[ -f "$log_file" ]]; then
              tail -n 80 "$log_file"
            else
              echo "(no sync log captured)"
            fi
            echo '```'
          } >"$body_file"
          existing="$(gh issue list --repo "$repo" --label fork-sync --state open --limit 100 --json number,title --jq '[.[] | select(.title=="fork sync failed")][0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment --repo "$repo" "$existing" --body-file "$body_file"
          else
            gh issue create --repo "$repo" --label fork-sync --title "$title" --body-file "$body_file"
          fi

  test:
    needs: sync
    if: >-
      needs.sync.result == 'success' &&
      (github.event_name != 'schedule' || needs.sync.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Test rename + hook allowlist
        env:
          PROTOC: /usr/bin/protoc
        run: |
          cargo test -p xai-grok-hooks --lib
          cargo test -p xai-grok-shell --lib -- rename_pins_manual
